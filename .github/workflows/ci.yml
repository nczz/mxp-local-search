name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config

      - name: Build and verify release artifacts
        run: MXP_RELEASE_BUILD_ENV=host MXP_RELEASE_CI_SCOPE=artifacts scripts/release-ci.sh

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-dist
          path: release/dist/**
          if-no-files-found: ignore
